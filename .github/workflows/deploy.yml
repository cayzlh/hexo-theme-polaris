# .github/workflows/deploy.yml
name: cayzlh.com

on:
  push:
    branches:
      - master

jobs:
  trigger-build:
    name: Trigger blog-framework build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog build via gh
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN }}
        run: |
          echo "🚀 Triggering build for cayzlh/blog-framework..."
          gh api repos/cayzlh/blog-framework/dispatches \
            --method POST \
            -f event_type=Hexo \
            --silent
          echo "✅ Dispatch sent successfully!"